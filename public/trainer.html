<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainer Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1316;--panel:#111c20;--line:#22333a;--ink:#e8eef0;--muted:#8fa3aa;--teal:#14c8a8;--teal-d:#0fa58a;--blue:#4f7cff;--warn:#f08c5a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 500px at 10% -10%,#0f2a2a,transparent),var(--bg);min-height:100vh;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:32px 16px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-weight:600;background:#0f1a1e}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.pill.live{border-color:var(--teal);color:var(--teal)}.pill.paused{border-color:var(--warn);color:var(--warn)}
h1{font-size:clamp(26px,4vw,34px);margin:28px 0 4px;letter-spacing:-.02em}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
a{color:var(--teal)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}
.steps div{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--muted)}
.steps .done{border-color:var(--teal);color:var(--teal)}.steps .now{border-color:var(--blue);color:#cdd8ff;background:#111a33}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:16px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-right:8px}
button,.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;cursor:pointer;border:1px solid #3a4b52;background:#151f23;color:var(--ink);text-decoration:none;display:inline-block}
button.primary{background:var(--teal);border-color:var(--teal);color:#04201b}button.primary:hover{background:var(--teal-d)}
button.danger{border-color:var(--warn);color:var(--warn)}
button:disabled{opacity:.45;cursor:default}
.banner{border:1px solid var(--teal);color:var(--teal);border-radius:12px;padding:14px 20px;margin-top:16px}
.banner.paused{border-color:var(--warn);color:var(--warn)}.banner.waiting{border-color:var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
h2{color:var(--teal);font-size:18px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.08em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid #1a282d}
.big{font-size:44px;font-weight:800;color:var(--teal);line-height:1}
.bar{height:8px;border-radius:4px;background:#1c2a2f;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--teal)}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.round{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.optrow{display:grid;grid-template-columns:24px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.optrow>div{min-width:0}.optrow .t{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.best{color:var(--teal);font-weight:700}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#1c2a2f;font-weight:700}
tr.r1 .rank{background:#d4a72c;color:#1a1300}tr.r2 .rank{background:#aab4bb;color:#111}tr.r3 .rank{background:#b9774a;color:#160b03}
input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #3a4b52;background:#0d1619;color:var(--ink)}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.linkbox code{background:#0d1619;border:1px solid var(--line);padding:9px 12px;border-radius:8px;word-break:break-all}
.err{color:var(--warn);min-height:20px;margin-top:8px}
.login{max-width:420px;margin:12vh auto}
@media (max-width:820px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const app = document.getElementById('app');
const code = decodeURIComponent(location.pathname.split('/')[2] || '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = (u, body, method) => fetch(u, body !== undefined || method ? {method: method || 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})} : {}).then(async r => ({ok:r.ok, status:r.status, data: await r.json().catch(() => ({}))}));
let info, timer;
const time = t => t ? new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'}) : '';

function topBar(status){
  return `<div class="top"><div class="brand">${esc(info.brand)}</div>
  <div style="display:flex;gap:8px;align-items:center"><span class="pill">TRAINER MODE</span>${status ? `<span class="pill ${status}">${status.toUpperCase()}</span>` : ''}
  <button onclick="logout()" style="padding:5px 12px;font-size:13px">Log out</button></div></div>`;
}
async function logout(){ await api('/api/trainer/logout', {}); location.href = '/trainer'; }

function loginView(){
  app.innerHTML = `<div class="login panel"><div class="brand" style="display:inline-block">${esc(info.brand)}</div>
  <h1 style="margin-top:18px">Trainer login</h1><p class="muted">${esc(info.title)}</p>
  <form id="f"><input id="pw" type="password" placeholder="Trainer password" style="width:100%" autofocus>
  <div class="err" id="err"></div><button class="primary">Log in</button></form></div>`;
  f.onsubmit = async e => { e.preventDefault(); const r = await api('/api/trainer/login', {password: pw.value}); if (!r.ok) return err.textContent = r.data.error; boot(); };
}

async function batchesView(){
  const r = await api('/api/trainer/batches');
  app.innerHTML = topBar() + `<h1>Trainer Dashboard</h1><p class="muted">${esc(info.title)} · ${esc(info.module)}</p>
  <div class="panel"><h2>Create a batch</h2><form id="f" class="controls"><input id="c" placeholder="Batch code, e.g. clscmp-m6"><button class="primary">Create batch</button></form><div class="err" id="err"></div></div>
  <div class="panel"><h2>Your batches</h2>${r.data.length ? `<table><tr><th>BATCH</th><th>STATUS</th><th>LEARNERS</th><th>CREATED</th><th></th></tr>
  ${r.data.map(b => `<tr><td><a href="/trainer/${encodeURIComponent(b.code)}"><b>${esc(b.code)}</b></a></td><td>${esc(b.status)}</td><td>${b.learners}</td><td>${new Date(b.created_at).toLocaleDateString()}</td>
  <td style="text-align:right"><a class="btn" href="/trainer/${encodeURIComponent(b.code)}">Open dashboard</a></td></tr>`).join('')}</table>` : '<p class="muted">No batches yet. Create one above.</p>'}</div>`;
  f.onsubmit = async e => { e.preventDefault(); const x = await api('/api/trainer/batches', {code: c.value}); if (!x.ok) return err.textContent = x.data.error; location.href = '/trainer/' + encodeURIComponent(x.data.code); };
}

async function act(a){
  if (a === 'reset' && !confirmReset()) return;
  await api(`/api/trainer/batches/${encodeURIComponent(code)}/${a}`, {}); load();
}
let resetArmed = 0;
function confirmReset(){ // two-click confirm, avoids browser dialogs
  if (Date.now() - resetArmed < 4000) { resetArmed = 0; return true; }
  resetArmed = Date.now(); const b = document.getElementById('resetBtn'); b.textContent = 'Click again to reset'; setTimeout(() => { if (b.isConnected) b.textContent = 'Reset simulation'; }, 4000); return false;
}

async function load(){
  clearTimeout(timer);
  const r = await api('/api/trainer/batches/' + encodeURIComponent(code));
  if (r.status === 401) return loginView();
  if (!r.ok) { app.innerHTML = topBar() + `<h1>Batch not found</h1><p><a href="/trainer">Back to batches</a></p>`; return; }
  render(r.data);
  timer = setTimeout(load, 3000);
}

function render(d){
  const link = location.origin + '/play/' + encodeURIComponent(d.code);
  const n = d.people.length, started = d.people.filter(p => p.started).length, finished = d.people.filter(p => p.answered === d.totalRounds).length;
  const anyAnswers = d.people.some(p => p.answered > 0);
  const stepCls = i => { const state = [true, n > 0, d.status !== 'waiting', anyAnswers, finished > 0 && finished === n];
    const now = state.lastIndexOf(true); return state[i] ? (i === now ? 'now' : 'done') : ''; };
  const banner = d.status === 'live' ? `Session is LIVE — ${n} participant(s) joined, ${finished} finished. Use Pause to send new joiners back to waiting, or Reset for a fresh cohort.`
    : d.status === 'paused' ? `Session PAUSED — new joiners wait in the waiting room. Learners already playing can finish. ${n} joined.`
    : `Waiting room — ${n} participant(s) joined. Start when all candidates have joined.`;
  const scroll = window.scrollY;
  app.innerHTML = topBar(d.status) + `<h1>Trainer Dashboard</h1>
  <div class="muted">${esc(d.title)}</div>
  <div class="muted">Batch <b style="color:var(--teal)">${esc(d.code)}</b> · <a href="/trainer">All batches</a></div>
  <div class="linkbox"><span class="muted">Learner link:</span><code id="lnk">${esc(link)}</code><button onclick="navigator.clipboard.writeText('${link}');this.textContent='Copied'">Copy</button></div>
  <div class="steps">${['1 · Trainer logged in','2 · Participants join','3 · Session live','4 · Round boards','5 · Final leaderboard'].map((s, i) => `<div class="${stepCls(i)}">${s}</div>`).join('')}</div>
  <div class="panel controls"><span class="label">SESSION CONTROLS</span>
    <button class="primary" onclick="act('start')" ${d.status === 'live' ? 'disabled' : ''}>Start session</button>
    <button onclick="act('pause')" ${d.status !== 'live' ? 'disabled' : ''}>Pause (waiting room)</button>
    <button class="danger" id="resetBtn" onclick="act('reset')">Reset simulation</button>
    <a class="btn" href="${esc(link)}" target="_blank">Open simulation</a>
    <a class="btn" href="/api/trainer/batches/${encodeURIComponent(d.code)}/export.csv">Download results (CSV)</a></div>
  <div class="banner ${d.status}">${banner}</div>
  <div class="grid" style="margin-top:0">
    <div class="panel"><h2>Registered learners (${n})</h2>${n ? `<table><tr><th>#</th><th>NAME</th><th>EMAIL</th><th>JOINED</th><th>PROGRESS</th></tr>
      ${d.people.slice().sort((a, b) => new Date(a.joined_at) - new Date(b.joined_at)).map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${time(p.joined_at)}</td>
      <td>${!p.started ? '<span class="muted">Waiting</span>' : `${p.answered}/${d.totalRounds}<div class="bar"><i style="width:${p.answered / d.totalRounds * 100}%"></i></div>`}</td></tr>`).join('')}</table>`
      : '<p class="muted">No one has joined yet. Share the learner link above.</p>'}</div>
    <div class="panel"><div class="big">${n}</div><div class="label" style="margin-top:8px">PARTICIPANTS READY</div>
      <p class="muted">${d.status === 'waiting' ? 'Start when all candidates have joined the waiting room.' : `${started - finished} playing · ${finished} finished`}</p>
      ${finished ? `<p class="muted">Group average: <b style="color:var(--ink)">${(d.people.filter(p => p.answered === d.totalRounds).reduce((s, p) => s + p.score, 0) / finished).toFixed(1)}</b> / ${d.maxScore}</p>` : ''}</div>
  </div>
  <div class="panel"><h2>Round boards</h2><div class="rounds">${d.rounds.map(r => `<div class="round">
    <div style="display:flex;justify-content:space-between;gap:8px"><b>${r.index + 1}. ${esc(r.title)}</b><span class="muted" style="font-size:13px;white-space:nowrap">${r.responses} resp.</span></div>
    <div class="muted" style="font-size:13px">Average ${r.avg == null ? '—' : r.avg.toFixed(1)} / ${r.max}</div>
    ${r.options.map(o => `<div class="optrow" title="${esc(o.text)}"><span class="${o.points === r.max ? 'best' : ''}">${o.id}</span>
      <div><div class="t">${esc(o.text)}</div><div class="bar"><i style="width:${r.responses ? o.n / r.responses * 100 : 0}%;${o.points === r.max ? '' : 'background:#4b6770'}"></i></div></div>
      <span style="text-align:right">${o.n} · ${o.points}pt</span></div>`).join('')}</div>`).join('')}</div></div>
  <div class="panel"><h2>Final leaderboard</h2>${n ? `<table><tr><th>RANK</th><th>NAME</th><th>SCORE</th><th>ROUNDS</th><th>FINISHED</th></tr>
    ${d.people.map((p, i) => `<tr class="r${i + 1}"><td><span class="rank">${i + 1}</span></td><td>${esc(p.name)}</td><td><b>${p.score}</b> <span class="muted">/ ${d.maxScore}</span></td><td>${p.answered}/${d.totalRounds}</td><td>${p.finished_at ? time(p.finished_at) : '<span class="muted">in progress</span>'}</td></tr>`).join('')}</table>`
    : '<p class="muted">Scores appear here as learners answer.</p>'}</div>`;
  if (Date.now() - resetArmed < 4000) document.getElementById('resetBtn').textContent = 'Click again to reset';
  window.scrollTo(0, scroll);
}

async function boot(){
  const me = await api('/api/trainer/me');
  if (!me.data.trainer) return loginView();
  code ? load() : batchesView();
}
api('/api/info').then(r => { info = r.data; document.title = 'Trainer Dashboard · ' + info.title; boot(); });
</script>
</body>
</html>
